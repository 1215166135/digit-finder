<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片数字</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 12px; background: #fff; color: #111; }
    main { max-width: 650px; margin: auto; }
    form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input, button { font: inherit; padding: 8px 12px; }
    input { width: 110px; }
    p, summary, li { line-height: 1.6; }
    .scroll { overflow-x: auto; }
    #grid { display: grid; grid-template-columns: repeat(13, 1fr); min-width: 312px; font-family: Consolas, "Courier New", monospace; font-size: clamp(18px, 3.6vw, 28px); }
    .cell { display: grid; place-items: center; height: 1.9em; border: 2px solid transparent; border-radius: 4px; }
    .matched { background: #fff2c6; border-color: #ffbd32; }
    .partner { border-color: #f04444; }
    #status { min-height: 26px; }
    li { margin-bottom: 6px; }
    #previews { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px; margin-top: 16px; }
    #previews:empty { display: none; }
    .preview { margin: 0; }
    .preview figcaption { font-size: 14px; color: #555; margin-bottom: 6px; }
    .mini-grid { display: grid; font: 28px Consolas, "Courier New", monospace; }
    .mini-grid .cell { width: 52px; height: 54px; }
  </style>
</head>
<body>
  <main>
  <form id="search">
    <label for="digits">输入三个数字</label>
    <input id="digits" type="text" inputmode="numeric" maxlength="3" placeholder="如 397" autocomplete="off" aria-describedby="rule">
    <button type="submit">查找</button>
    <button type="button" id="clear">清除</button>
  </form>
  <section id="previews" aria-label="每组匹配的独立数字块"></section>
  <p id="rule">查找 L 形，数字顺序不限。每组优先补成 2 行 × 3 列长方形，放不下再补成 3 行 × 2 列。黄色为原数字，红框为补出的数字；重叠时同时显示。点击结果可单独查看一组。</p>
  <p id="status" role="status" aria-live="polite">请输入三个数字后查找。</p>
  <div class="scroll"><div id="grid" aria-label="图片中的数字，17行13列"></div></div>
  <details id="details" hidden open><summary>查看匹配及对应数字（行列从 1 开始）</summary><button type="button" id="show-all">显示全部标注</button><ol id="results"></ol></details>
  </main>
  <script>
  const data = `8 3 7 3 6 1 7 7 4 4 2 2 8
5 1 2 2 0 6 1 9 7 6 4 0 5
2 5 4 7 2 3 8 4 9 7 3 4 2
2 4 1 6 5 9 3 4 5 1 9 3 2
1 2 0 5 8 8 6 7 4 8 8 6 1
4 3 7 4 0 9 3 0 3 4 0 5 4
8 5 9 2 4 5 7 8 4 2 0 7 8
7 0 0 6 9 6 4 9 9 8 9 7 7
0 6 4 0 7 5 8 3 8 6 2 3 0
8 3 0 7 1 7 2 6 0 9 4 6 8
2 1 1 1 8 0 6 5 5 6 1 4 2
6 4 0 4 2 1 1 6 3 5 1 3 6
8 9 0 0 0 2 7 3 5 3 4 3 8
8 5 0 2 8 3 0 1 8 9 7 5 8
1 7 4 4 2 7 8 4 8 6 0 7 1
6 8 9 2 8 1 5 4 2 7 9 1 6
8 3 7 3 6 1 7 7 4 4 2 2 8`;
  const matrix = data.split('\n').map(row => row.trim().split(/\s+/));
  const grid = document.getElementById('grid');
  const input = document.getElementById('digits');
  const status = document.getElementById('status');
  const details = document.getElementById('details');
  const results = document.getElementById('results');
  const previews = document.getElementById('previews');
  const cells = matrix.map((row, r) => row.map((digit, c) => {
    const cell = document.createElement('span');
    cell.className = 'cell';
    cell.textContent = digit;
    cell.title = `第 ${r + 1} 行，第 ${c + 1} 列`;
    grid.appendChild(cell);
    return cell;
  }));

  function findMatches(numbers, query) {
    const target = query.split('').sort().join('');
    const matches = [];
    for (let r = 0; r < numbers.length - 1; r++) {
      for (let c = 0; c < numbers[r].length - 1; c++) {
        const corners = [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]];
        for (let missing = 0; missing < 4; missing++) {
          const group = corners.filter((_, i) => i !== missing);
          const value = group.map(([y, x]) => numbers[y][x]).sort().join('');
          if (value === target) matches.push(group);
        }
      }
    }
    return matches;
  }

  function findPartner(group, rows, cols) {
    const minR = Math.min(...group.map(p => p[0]));
    const minC = Math.min(...group.map(p => p[1]));
    const occupied = new Set(group.map(p => p.join(',')));
    // 优先横向长方形；仅当补集也是一个 L 形时接受。
    for (const [height, width] of [[2, 3], [3, 2]]) {
      for (let top = minR - (height - 2); top <= minR; top++) {
        for (let left = minC - (width - 2); left <= minC; left++) {
          if (top < 0 || left < 0 || top + height > rows || left + width > cols) continue;
          const partner = [];
          for (let r = top; r < top + height; r++) {
            for (let c = left; c < left + width; c++) {
              if (!occupied.has(`${r},${c}`)) partner.push([r, c]);
            }
          }
          if (partner.length === 3 &&
              Math.max(...partner.map(p => p[0])) - Math.min(...partner.map(p => p[0])) === 1 &&
              Math.max(...partner.map(p => p[1])) - Math.min(...partner.map(p => p[1])) === 1) {
            return { group: partner, shape: `${height} 行 × ${width} 列` };
          }
        }
      }
    }
    return null;
  }

  let currentMatches = [];
  function renderPreviews(matches) {
    previews.replaceChildren();
    matches.forEach(({ group, partner }, index) => {
      const points = [...group, ...(partner ? partner.group : [])];
      const top = Math.min(...points.map(p => p[0]));
      const bottom = Math.max(...points.map(p => p[0]));
      const left = Math.min(...points.map(p => p[1]));
      const right = Math.max(...points.map(p => p[1]));
      const original = new Set(group.map(p => p.join(',')));
      const paired = new Set((partner ? partner.group : []).map(p => p.join(',')));
      const figure = document.createElement('figure');
      figure.className = 'preview';
      const caption = document.createElement('figcaption');
      caption.textContent = `第 ${index + 1} 组${partner ? '' : '（无法配成长方形）'}`;
      const mini = document.createElement('div');
      mini.className = 'mini-grid';
      mini.style.gridTemplateColumns = `repeat(${right - left + 1}, 52px)`;
      for (let r = top; r <= bottom; r++) {
        for (let c = left; c <= right; c++) {
          const key = `${r},${c}`;
          const cell = document.createElement('span');
          cell.className = 'cell' + (original.has(key) ? ' matched' : paired.has(key) ? ' partner' : '');
          if (original.has(key) || paired.has(key)) {
            cell.textContent = matrix[r][c];
            cell.title = `第 ${r + 1} 行，第 ${c + 1} 列；${original.has(key) ? '原数字' : '对应数字'}`;
          }
          mini.appendChild(cell);
        }
      }
      figure.append(caption, mini);
      previews.appendChild(figure);
    });
  }
  function paintMatches(matches) {
    cells.flat().forEach(cell => cell.classList.remove('matched', 'partner'));
    matches.forEach(({ group, partner }) => {
      group.forEach(([r, c]) => cells[r][c].classList.add('matched'));
      if (partner) partner.group.forEach(([r, c]) => cells[r][c].classList.add('partner'));
    });
  }
  function clearMarks() {
    currentMatches = [];
    paintMatches([]);
    results.replaceChildren();
    previews.replaceChildren();
    details.hidden = true;
  }

  document.getElementById('search').addEventListener('submit', event => {
    event.preventDefault();
    clearMarks();
    const query = input.value.trim();
    if (!/^\d{3}$/.test(query)) {
      status.textContent = '请输入恰好三个数字（0–9），可以重复。';
      input.focus();
      return;
    }
    const matches = findMatches(matrix, query);
    currentMatches = matches.map(group => ({ group, partner: findPartner(group, matrix.length, matrix[0].length) }));
    renderPreviews(currentMatches);
    currentMatches.forEach((match, index) => {
      const { group, partner } = match;
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = `单独查看第 ${index + 1} 组`;
      button.addEventListener('click', () => {
        paintMatches([match]);
        status.textContent = `正在单独查看第 ${index + 1} 组，共 ${matches.length} 组。`;
      });
      const describe = points => points.map(([r, c]) => `${matrix[r][c]}（${r + 1}行${c + 1}列）`).join('、');
      const text = document.createElement('div');
      text.textContent = `原数字：${describe(group)}；` + (partner
        ? `对应数字：${partner.group.map(([r, c]) => matrix[r][c]).join('')}，组成 ${partner.shape}；位置：${describe(partner.group)}`
        : '边界不足，无法组成两种长方形。');
      item.append(button, text);
      results.appendChild(item);
    });
    paintMatches(currentMatches);
    status.textContent = `“${query}”共找到 ${matches.length} 组 L 形，其中 ${currentMatches.filter(m => m.partner).length} 组可组成长方形，已全部标注。`;
    details.hidden = matches.length === 0;
  });
  document.getElementById('show-all').addEventListener('click', () => {
    paintMatches(currentMatches);
    status.textContent = `已显示全部 ${currentMatches.length} 组标注。`;
  });
  input.addEventListener('input', () => {
    clearMarks();
    status.textContent = '请输入三个数字后查找。';
  });
  document.getElementById('clear').addEventListener('click', () => {
    input.value = '';
    clearMarks();
    status.textContent = '请输入三个数字后查找。';
    input.focus();
  });
  </script>
</body>
</html>
